name: gp_app
description: GP mobile app for Laravel Sanctum backend
publish_to: "none"
version: 0.2.2+4
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.0
  go_router: ^14.0.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.2
  intl: ^0.19.0
  file_picker: ^8.0.0
  google_fonts: ^8.0.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^17.0.0
  url_launcher: ^6.3.2
  flutter_google_places_sdk: ^0.4.0
  geolocator: ^12.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  rename_app: ^1.6.5
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/app_logo.png"
  android: true
  ios: true
  web: true
