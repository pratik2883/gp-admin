<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Specialist Portal - Secure Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-container": "#9c3f00",
              "surface-container-high": "#e7e8eb",
              "on-primary-container": "#c5d4ff",
              "background": "#f8f9fc",
              "on-primary-fixed-variant": "#00419d",
              "surface-container": "#edeef1",
              "on-secondary-fixed-variant": "#36466d",
              "primary-container": "#1a56be",
              "on-tertiary-fixed": "#351000",
              "on-surface-variant": "#434653",
              "on-primary-fixed": "#001946",
              "tertiary-fixed-dim": "#ffb693",
              "on-tertiary-fixed-variant": "#7a3000",
              "surface-container-lowest": "#ffffff",
              "on-secondary-fixed": "#061a3f",
              "on-secondary-container": "#475780",
              "on-secondary": "#ffffff",
              "inverse-surface": "#2e3133",
              "primary": "#003f98",
              "tertiary": "#762e00",
              "surface-variant": "#e1e2e5",
              "surface-container-low": "#f2f3f6",
              "outline-variant": "#c3c6d5",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "surface": "#f8f9fc",
              "secondary": "#4e5d86",
              "on-surface": "#191c1e",
              "secondary-fixed-dim": "#b5c6f5",
              "primary-fixed-dim": "#b1c5ff",
              "surface-tint": "#1f59c1",
              "secondary-fixed": "#d9e2ff",
              "error-container": "#ffdad6",
              "on-tertiary-container": "#ffc9b0",
              "surface-container-highest": "#e1e2e5",
              "primary-fixed": "#d9e2ff",
              "on-tertiary": "#ffffff",
              "outline": "#737784",
              "tertiary-fixed": "#ffdbcc",
              "secondary-container": "#becefd",
              "on-background": "#191c1e",
              "error": "#ba1a1a",
              "on-error": "#ffffff",
              "inverse-on-surface": "#f0f1f4",
              "surface-dim": "#d9dadd",
              "inverse-primary": "#b1c5ff",
              "surface-bright": "#f8f9fc"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .tonal-layering-no-borders {
            border: none !important;
        }
        .glassmorphism-with-ghost-border {
            border-top: 1px solid rgba(195, 198, 213, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar Component -->
<header class="fixed top-0 left-0 w-full z-50 px-6 py-4 flex items-center justify-between bg-gradient-to-br from-[#003f98] to-[#1a56be] dark:from-[#002d6d] dark:to-[#003f98] rounded-b-[24px] shadow-lg shadow-black/10 tonal-layering-no-borders">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-white text-2xl" data-icon="medical_services">medical_services</span>
<span class="font-manrope font-bold tracking-tight text-white text-xl">Specialist Portal</span>
</div>
<div class="flex items-center gap-4">
<button class="text-white/70 hover:bg-white/10 transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-6 pt-24 pb-32">
<div class="w-full max-w-md flex flex-col items-center">
<!-- Hero Icon & Title Section -->
<div class="mb-10 text-center">
<div class="w-24 h-24 bg-primary-container/10 rounded-full flex items-center justify-center mb-6 mx-auto">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="clinical_notes" style="font-variation-settings: 'FILL' 1;">clinical_notes</span>
</div>
<h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-on-surface mb-2">Specialist Login</h1>
<p class="text-on-surface-variant text-lg">Access your referral leads</p>
</div>
<!-- Login Form Card -->
<div class="w-full bg-surface-container-lowest rounded-[24px] p-8 shadow-sm">
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-manrope font-semibold text-lg text-on-surface ml-1">Email or Mobile Number</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full h-16 pl-12 pr-4 bg-surface-container-low border-none rounded-xl text-lg focus:ring-2 focus:ring-surface-tint focus:bg-surface-container-lowest transition-all placeholder:text-outline/60" placeholder="name@medicalgroup.com" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block font-manrope font-semibold text-lg text-on-surface">Password</label>
<a class="text-primary font-bold hover:underline text-sm tracking-wide" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full h-16 pl-12 pr-12 bg-surface-container-low border-none rounded-xl text-lg focus:ring-2 focus:ring-surface-tint focus:bg-surface-container-lowest transition-all placeholder:text-outline/60" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-16 bg-gradient-to-br from-[#003f98] to-[#1a56be] text-white font-bold text-xl rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Log In
                        <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-surface-container-lowest text-outline font-bold tracking-widest uppercase text-xs">OR</span>
</div>
</div>
<!-- Secondary Action -->
<button class="w-full h-16 bg-surface-container-high text-on-surface font-bold text-lg rounded-xl active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="fingerprint">fingerprint</span>
                    Biometric Login
                </button>
</div>
<!-- Registration Footer -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant font-medium">
                    New to Specialist Portal? 
                    <a class="text-primary font-extrabold hover:underline ml-1" href="#">Register as Specialist</a>
</p>
</div>
</div>
</main>
<!-- BottomNavBar (Status Context) -->
<nav class="fixed bottom-0 w-full flex justify-around items-center px-4 py-3 pb-safe bg-white/85 dark:bg-[#191c1e]/85 backdrop-blur-md shadow-[0_-8px_24px_rgba(25,28,30,0.06)] glassmorphism-with-ghost-border z-50">
<a class="flex flex-col items-center justify-center bg-[#003f98]/10 text-[#003f98] dark:text-[#1a56be] rounded-2xl p-2 transition-all active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-manrope text-[12px] font-medium tracking-wide">Secure Login</span>
</a>
<a class="flex flex-col items-center justify-center text-[#191c1e]/60 dark:text-white/60 p-2 hover:bg-[#003f98]/5 transition-all active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="contact_support">contact_support</span>
<span class="font-manrope text-[12px] font-medium tracking-wide">Support</span>
</a>
<a class="flex flex-col items-center justify-center text-[#191c1e]/60 dark:text-white/60 p-2 hover:bg-[#003f98]/5 transition-all active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="verified_user">verified_user</span>
<span class="font-manrope text-[12px] font-medium tracking-wide">System Status</span>
</a>
</nav>
</body></html>
